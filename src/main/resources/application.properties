spring.application.name=fluxgate
server.port=${PORT:8080}

# Comma-separated list of backend URLs, overridable via FLUXGATE_BACKENDS environment variable
fluxgate.backends=${FLUXGATE_BACKENDS:http://localhost:8081,http://localhost:8082,http://localhost:8083}

# Periodic health check settings
fluxgate.health-check.enabled=true
fluxgate.health-check.interval-ms=10000
fluxgate.health-check.timeout-ms=2000
fluxgate.health-check.health-path=/health

# Proxy timeouts
fluxgate.proxy.connect-timeout-ms=3000
fluxgate.proxy.read-timeout-ms=10000

# High-speed Edge Response Caching
fluxgate.cache.enabled=true
fluxgate.cache.default-ttl-seconds=30
fluxgate.cache.max-entries=500
