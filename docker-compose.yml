version: '3.8'

services:
  fluxgate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxgate-proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FLUXGATE_BACKENDS=http://backend1:8081,http://backend2:8082,http://backend3:8083
      - FLUXGATE_HEALTH_CHECK_ENABLED=true
      - FLUXGATE_HEALTH_CHECK_INTERVAL_MS=5000
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped

  backend1:
    build:
      context: ./demo-backend
      dockerfile: Dockerfile
    container_name: fluxgate-backend-1
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SERVER_NAME=backend-1
    restart: unless-stopped

  backend2:
    build:
      context: ./demo-backend
      dockerfile: Dockerfile
    container_name: fluxgate-backend-2
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SERVER_NAME=backend-2
    restart: unless-stopped

  backend3:
    build:
      context: ./demo-backend
      dockerfile: Dockerfile
    container_name: fluxgate-backend-3
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - SERVER_NAME=backend-3
    restart: unless-stopped
