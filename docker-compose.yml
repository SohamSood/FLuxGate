version: '3.8'

services:
  fluxgate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxgate-proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FLUXGATE_BACKENDS=http://backend1:80,http://backend2:80,http://backend3:80
      - FLUXGATE_HEALTH_CHECK_ENABLED=true
      - FLUXGATE_HEALTH_CHECK_INTERVAL_MS=5000
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped

  backend1:
    image: traefik/whoami:v1.10.1
    container_name: fluxgate-backend-1
    ports:
      - "8081:80"
    restart: unless-stopped

  backend2:
    image: traefik/whoami:v1.10.1
    container_name: fluxgate-backend-2
    ports:
      - "8082:80"
    restart: unless-stopped

  backend3:
    image: traefik/whoami:v1.10.1
    container_name: fluxgate-backend-3
    ports:
      - "8083:80"
    restart: unless-stopped
